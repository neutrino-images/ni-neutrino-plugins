name: Update submodule pins

on:
  schedule:
    # Offset from the full hour. The superproject that carries this
    # repository runs the same workflow at :47, so a plugin fix reaches
    # it without waiting for a second full cycle.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# A second run waits instead of cutting off a push in flight. GitHub
# keeps only ONE pending run per group, which is all this needs.
concurrency:
  group: update-submodule-pins
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Cron only ever runs from the default branch anyway; this gate keeps
    # a manual start from another branch or a tag out, where the checkout
    # would be detached and the push would go nowhere.
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Move every submodule to the tip of its branch
        # bash explicitly: the default shell has no pipefail, and without
        # it the awk pipeline below swallows every git error (exit 0
        # instead of 128).
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "tuxbox-ci"
          git config user.email "ci@tuxbox-neutrino.org"
          # --remote: the branch from .gitmodules, else the remote HEAD.
          # Shallow, because only the gitlink is needed.
          git submodule update --init --remote --depth 1 --jobs 4
          # exit 0 = nothing moved, 1 = moved, anything else = failure
          rc=0
          git diff --quiet --ignore-submodules=dirty || rc=$?
          case "$rc" in
            0) echo "all pins current"; exit 0 ;;
            1) ;;
            *) echo "git diff failed with $rc"; exit "$rc" ;;
          esac
          git add -u
          # Build the message from what is really committed: the raw diff
          # of the index, one gitlink per line
          # (:160000 160000 <old> <new> M <path>).
          git diff --cached --raw --abbrev=7 --ignore-submodules=dirty > /tmp/raw
          awk '$1 == ":160000" { printf "  %s %s..%s\n", $6, $3, $4 }' /tmp/raw > /tmp/pins
          # Only gitlinks may end up in the commit, and at least one.
          if [ ! -s /tmp/pins ] || grep -qv '^:160000' /tmp/raw; then
            echo "unexpected staged content:"
            cat /tmp/raw
            exit 1
          fi
          {
            echo "chore (plugins): follow the submodule branches"
            echo
            cat /tmp/pins
          } > /tmp/msg
          git commit -F /tmp/msg
          git push origin HEAD:master
